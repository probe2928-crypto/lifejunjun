name: fetch-media
on:
  push:
    branches: [fetch]
    paths: ['fetch/jobs.json']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fetch }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts==7.2.3
      - run: python fetch/run.py
      - run: |
          git config user.name "lifejunjun-bot"
          git config user.email "probe2928@users.noreply.github.com"
          git add fetch/out
          git commit -m "fetch results" || echo nothing
          git push origin HEAD:fetch
