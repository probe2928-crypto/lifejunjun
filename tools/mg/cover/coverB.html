<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BH;src:url(../fonts/BlackHanSans-Regular.ttf)}
@font-face{font-family:PB;src:url(../fonts/Pretendard-Black.otf)}
@font-face{font-family:PS;src:url(../fonts/Pretendard-SemiBold.otf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#07081a}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,15,.82) 0%,rgba(5,6,15,.55) 42%,rgba(5,6,15,.15) 60%,rgba(5,6,15,.75) 100%),url(mb.jpg) center/cover;}
.bgx{
 radial-gradient(closest-side at 20% 70%,rgba(0,187,249,.55),transparent),
 radial-gradient(closest-side at 85% 35%,rgba(155,93,229,.6),transparent),
 radial-gradient(closest-side at 60% 95%,rgba(241,91,181,.45),transparent),#07081a}
.c{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.badge{top:300px}.badge span{display:inline-block;font-family:PB;font-size:46px;color:#0b0d0a;background:#ffd60a;padding:12px 30px 8px;border-radius:999px}
.t1{top:400px;font-family:BH;font-size:150px;color:#fff;line-height:1;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.t2{top:570px;font-family:BH;font-size:170px;color:#0b0d0a;line-height:1}
.t2 span{display:inline-block;background:#c8ff2e;padding:18px 40px 6px;border-radius:18px;transform:rotate(-2deg);box-shadow:0 12px 40px rgba(200,255,46,.35)}
/* cup */
.cup{position:absolute;left:330px;top:900px;width:420px;height:560px}
.glass{position:absolute;inset:0;border:12px solid rgba(255,255,255,.9);border-top:none;border-radius:0 0 120px 120px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 0 90px rgba(0,187,249,.45)}
.cof{position:absolute;left:0;right:0;bottom:0;height:540px;background:linear-gradient(180deg,#5a3520,#1e1007)}
.rim{position:absolute;left:-22px;top:-12px;width:524px;height:24px;border-radius:12px;background:#fff}
.ice{position:absolute;width:140px;height:140px;border-radius:26px;background:linear-gradient(145deg,rgba(225,247,255,.95),rgba(140,210,240,.55));border:4px solid rgba(255,255,255,.9);box-shadow:0 0 30px rgba(56,214,255,.6)}
.shine{position:absolute;left:44px;top:40px;width:36px;height:480px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.6),transparent)}
.straw{position:absolute;left:330px;top:-110px;width:34px;height:480px;background:repeating-linear-gradient(180deg,#ff3b30 0 40px,#fff 40px 80px);border-radius:17px;transform:rotate(14deg)}
.chip{position:absolute;font-family:PB;font-size:52px;color:#fff;padding:12px 28px 8px;border-radius:999px;border:3px solid rgba(255,255,255,.6);background:rgba(11,13,10,.75)}
.q{top:1540px;font-family:PB;font-size:64px;color:#fff}
.q b{color:#ffd60a}
</style></head><body><div class="bg"></div>
<div class="c badge"><span>☕ 싱가포르 호커센터 3탄</span></div>
<div class="c t1">싱가포르에서</div>
<div class="c t2"><span>'아아' 주문법</span></div>
<div class="cup"><div class="straw"></div><div class="glass"><div class="cof"></div>
<div class="ice" style="left:60px;top:120px;transform:rotate(-12deg)"></div><div class="ice" style="left:250px;top:170px;transform:rotate(10deg)"></div><div class="ice" style="left:140px;top:300px;transform:rotate(4deg)"></div>
<div class="shine"></div></div><div class="rim"></div></div>
<div class="chip" style="left:90px;top:1000px;transform:rotate(-8deg)">코피 오</div>
<div class="chip" style="left:790px;top:1120px;transform:rotate(7deg);border-color:#ff5fa2">코송</div>
<div class="chip" style="left:120px;top:1310px;transform:rotate(5deg);border-color:#38d6ff">펭 🧊</div>
<div class="c q">그냥 <b>'커피'</b> 시키면 연유 커피 나와요</div>
</body></html>
