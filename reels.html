<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.rl-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;border-bottom:1px solid var(--rule)}
.rl-hero{padding:40px 0 18px}
.rl-hero h1{font-size:clamp(34px,8vw,56px);font-weight:900;line-height:1.12;letter-spacing:-.02em}
.rl-hero p{color:var(--soft);margin-top:12px;max-width:34em}
.rl-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:22px 0 8px}
.rl-quick a{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;text-decoration:none;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule)}
.rl-quick a.kakao{background:var(--seal);color:#fff;box-shadow:none;grid-column:1/-1}
.rl-quick a:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.reel{background:var(--sheet);margin:18px 0;border:1px solid var(--rule);padding:18px 18px 8px}
.reel .hd{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;margin-bottom:10px}
@media(min-width:760px){.reel{padding:26px 28px 12px}.reel .hd{grid-template-columns:132px 1fr;gap:24px}}
.reel .cv{background:#111;aspect-ratio:9/16;width:100%;object-fit:cover;display:block}
.reel .tt{display:flex;flex-direction:column;gap:8px;min-width:0}
.reel .kk{color:var(--seal)}
.reel h2{font-size:clamp(20px,5.4vw,28px);font-weight:900;line-height:1.3;white-space:pre-line}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{border-top:1px solid var(--rule)}
.rank a,.rank .row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:12px 0;text-decoration:none;min-height:56px}
.rank b{font-family:var(--serif);font-size:22px;font-weight:900;color:var(--seal);text-align:center}
.rank .nm{font-weight:700;line-height:1.35}
.rank .pl{display:block;font-size:13px;color:var(--soft);font-weight:400}
.rank .go{font-size:12.5px;font-weight:700;white-space:nowrap;padding:6px 10px;box-shadow:inset 0 0 0 1px var(--ink)}
.rank a:hover .go{background:var(--ink);color:#fff}
.rank .go.soon{box-shadow:inset 0 0 0 1px var(--rule);color:var(--soft)}
.rl-empty{padding:30px 0;color:var(--soft)}
footer.rl-f{padding:36px 0 60px;color:var(--soft);font-size:13.5px}
</style>
</head>
<body>
<header class="wrap rl-top">
  <a class="brand" href="index.html" aria-label="인생준준 처음으로">
    <span class="seal" aria-hidden="true">인생<br>준준</span>
    <span><b>인생준준</b><small>LIFE JUNJUN · REELS</small></span>
  </a>
  <a class="cta ghost" href="index.html">홈</a>
</header>

<main class="wrap">
  <section class="rl-hero">
    <span class="mono">From the reels</span>
    <h1>릴스에서 본 그곳,<br>여기 다 있어요.</h1>
    <p>최근 릴스에 나온 TOP 5를 1위부터 모았어요. 끌리는 곳을 누르면 대회 일정·경비나 여행 정보로 바로 이어집니다.</p>
    <nav class="rl-quick" aria-label="바로가기">
      <a class="kakao" href="https://open.kakao.com/o/g2VCOFTi" target="_blank" rel="noopener">같이 갈 사람들 모인 카톡방 들어가기</a>
      <a href="run.html">RUN &amp; TREK 대회</a>
      <a href="index.html#trips">역사 여행</a>
      <a href="https://probe2928-crypto.github.io/yeobaek/">여백의 지도</a>
      <a href="index.html#apply">동행 신청</a>
    </nav>
  </section>

  <div id="list" aria-live="polite"><p class="rl-empty">릴스 목록을 불러오는 중이에요…</p></div>
</main>

<footer class="wrap rl-f">© 2026 인생준준 · <a href="https://www.instagram.com/lifejunjun/" target="_blank" rel="noopener">@lifejunjun</a></footer>

<script>
const KAKAO="https://open.kakao.com/o/g2VCOFTi";
const STOP=new Set(["마라톤","트레킹","트레일","일주","코스","10K","하프","풀","걷기","러닝","일출","선셋","the","길"]);
const j=u=>fetch(u,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
const words=s=>(s||"").replace(/[·,()\/→]/g," ").split(/\s+/).filter(w=>w.length>=2&&!STOP.has(w));
function el(t,a={},...kids){const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==="text")e.textContent=v;else e.setAttribute(k,v)}kids.forEach(c=>c&&e.append(c));return e}

function findLink(it,races,pkgs){
  const nw=words(it.name);
  let best=null,score=0;
  for(const r of races){const rw=new Set(words(r.title+" "+r.sub+" "+r.city));const s=nw.filter(w=>rw.has(w)).length;if(s>score){score=s;best=r}}
  if(best)return{href:"run.html?id="+encodeURIComponent(best.id),label:"대회 보기"};
  const place=(it.place||"").replace(/시엠레아프/g,"시엠립");
  for(const p of pkgs){
    // cities look like "중국 시안 · 화산" or "조지아 트빌리시 / 아르메니아 예레반": skip the country word of each "/" part
    const cs=(p.cities||"").split("/").flatMap(seg=>words(seg).slice(1));
    const pw=new Set(words(place));
    if(cs.some(c=>pw.has(c)))return{href:"index.html#trip-"+encodeURIComponent(p.id),label:"여행 보기"}}
  return null;
}

(async()=>{
  const list=document.getElementById("list");
  try{
    const [q,rj,pj]=await Promise.all([j("media/queue.json"),j("races.json").catch(()=>({races:[]})),j("packages.json").catch(()=>({packages:[]}))]);
    const races=rj.races||[],pkgs=pj.packages||[];
    const items=(q.items||[]).filter(i=>/^media\/viral/.test(i.video||"")).reverse().slice(0,8);
    const specs=await Promise.all(items.map(i=>j("tools/film/specs/"+i.video.replace(/^media\//,"").replace(/\.mp4$/,".json")).catch(()=>null)));
    list.textContent="";
    let n=0;
    items.forEach((it,k)=>{
      const s=specs[k];if(!s||!Array.isArray(s.items)||!s.items.length)return;n++;
      const card=el("article",{class:"reel"});
      const hd=el("div",{class:"hd"});
      if(it.cover)hd.append(el("img",{class:"cv",src:it.cover,alt:"",loading:n>1?"lazy":"eager"}));
      else hd.style.gridTemplateColumns="1fr";
      const tt=el("div",{class:"tt"});
      tt.append(el("span",{class:"mono kk",text:(s.hook&&s.hook.kicker||"TOP 5").replace(/\s+/g," ")}));
      tt.append(el("h2",{text:(s.hook&&s.hook.title)||""}));
      hd.append(tt);card.append(hd);
      const ol=el("ol",{class:"rank"});
      [...s.items].sort((a,b)=>a.rank-b.rank).forEach(x=>{
        const lk=findLink(x,races,pkgs);
        const inner=[el("b",{text:String(x.rank)}),(()=>{const d=el("span",{class:"nm",text:x.name});d.append(el("span",{class:"pl",text:[x.place,x.fact].filter(Boolean).join(" · ")}));return d})(),
          lk?el("span",{class:"go",text:lk.label+" →"}):el("span",{class:"go soon",text:"같이 갈 사람?"})];
        const a=lk?el("a",{href:lk.href}):el("a",{href:KAKAO,target:"_blank",rel:"noopener"});
        inner.forEach(c=>a.append(c));
        ol.append(el("li",{},a));
      });
      card.append(ol);list.append(card);
    });
    if(!n)list.append(el("p",{class:"rl-empty",text:"아직 올라온 릴스가 없어요. 인스타 @lifejunjun에서 먼저 만나요."}));
  }catch(e){list.textContent="";list.append(el("p",{class:"rl-empty",text:"목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요."}))}
})();
</script>
</body>
</html>
